<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens — Multimodal Digital Forensics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='28' cy='28' r='18' fill='none' stroke='%235eb1ff' stroke-width='6'/><line x1='41' y1='41' x2='58' y2='58' stroke='%235eb1ff' stroke-width='7' stroke-linecap='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 64 64" width="30" height="30"><circle cx="28" cy="28" r="18" fill="none" stroke="currentColor" stroke-width="6"/><line x1="41" y1="41" x2="58" y2="58" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M19 28h5l3-7 4 14 3-7h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
      <span>Truth<b>Lens</b></span>
    </a>
    <nav>
      <a href="#/" data-nav="home">New analysis</a>
      <a href="#/history" data-nav="history">History</a>
    </nav>
    <div id="caps" class="caps"></div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span>TruthLens provides forensic indicators and evidence references. It does not provide a final legal determination of authenticity.</span>
  </footer>

  <div id="lightbox" class="lightbox hidden"><img alt="evidence" /><div class="lb-cap"></div></div>
  <div id="toast" class="toast hidden"></div>

  <!-- ===================== TEMPLATES ===================== -->
  <template id="tpl-home">
    <section class="hero">
      <div>
        <h1>Explainable multimodal <span class="grad">deepfake &amp; manipulation</span> forensics</h1>
        <p class="lead">Upload an image, video or audio file — optionally with the caption or claim that came with it. TruthLens inspects every modality, cross-checks them against each other and produces an evidence-linked forensic report.</p>
        <ul class="pills">
          <li>Image forensics</li><li>Video frame analysis</li><li>Audio &amp; voice</li><li>OCR &amp; claims</li><li>Lip-sync cross-check</li><li>PDF / JSON report</li>
        </ul>
      </div>
    </section>

    <section class="card upload-card">
      <div id="drop" class="drop">
        <input id="file" type="file" multiple accept="image/*,video/*,audio/*,.mp4,.mov,.mkv,.webm,.avi,.wav,.mp3,.m4a,.flac,.ogg" hidden />
        <div class="drop-icon">⇪</div>
        <div class="drop-title">Drop media files here or <u>browse</u></div>
        <div class="drop-sub">JPG · PNG · WEBP · MP4 · MOV · WEBM · WAV · MP3 · M4A — up to 5 files</div>
      </div>
      <ul id="filelist" class="filelist"></ul>
      <label class="lbl" for="claim">Claim / caption / transcript to verify <span class="muted">(optional)</span></label>
      <textarea id="claim" rows="3" placeholder='e.g. "This video shows a flood in Delhi today."  or  "The minister said we will close the campus tomorrow."'></textarea>
      <div class="upload-actions">
        <div class="privacy">🔒 Files are processed on this server only — no third-party AI APIs. Originals are stored read-only and hashed (SHA-256).</div>
        <button id="go" class="btn primary" disabled>Analyze media</button>
      </div>
    </section>

    <section class="how">
      <div class="step"><span>1</span><h4>Upload</h4><p>Image, video, audio + optional claim. File type is verified by magic bytes and hashed.</p></div>
      <div class="step"><span>2</span><h4>Analyze</h4><p>ELA, noise, copy-move, faces, key-frames, spectrogram, pitch, OCR, transcript.</p></div>
      <div class="step"><span>3</span><h4>Correlate</h4><p>Lip movement vs audio, caption vs speech, visible dates vs claim, metadata vs claim.</p></div>
      <div class="step"><span>4</span><h4>Report</h4><p>Risk score with breakdown, evidence for every finding, limitations, human review.</p></div>
    </section>
  </template>

  <template id="tpl-progress">
    <section class="card progress-card">
      <h2>Analyzing media…</h2>
      <p class="muted" id="prog-msg">Starting</p>
      <div class="bar"><div id="prog-bar"></div></div>
      <div class="prog-pct" id="prog-pct">0%</div>
      <ol id="prog-log" class="log"></ol>
    </section>
  </template>

  <template id="tpl-history">
    <section class="card">
      <div class="row-between"><h2>Analysis history</h2><a class="btn" href="#/">+ New analysis</a></div>
      <table class="tbl" id="hist-table">
        <thead><tr><th>Date (UTC)</th><th>Files</th><th>Claim</th><th>Risk</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="hist-empty" class="muted hidden">No analyses yet.</p>
    </section>
  </template>

  <script src="/js/app.js"></script>
</body>
</html>
